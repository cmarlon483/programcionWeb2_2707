<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARRITO DE COMPRAS</title>
</head>
<body>
    <h1>Carrito de compras</h1>
    <div>
        <ul id="carrito">

            <!-- aqui se guardaran los productos del carrito de compras -->
        </ul>
    </div>
    <br>
    <form id="formulario">
        <!-- aqui se guardaran los campos del formulario -->
        <label for="nombre">Nombre del producto</label>
        <input type="text" id="nombre" name="nombre"> <br>
        
        <label for="precio">Precio del producto</label>
        <input type="number" id="precio" name="precio" step="0.01"><br>
        
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" name="cantidad" min="1" value="1"><br>
        
        <button type="submit">Agregar al carrito</button>
        
    </form>
    <script src="app.js"></script>
</body>
</html>
